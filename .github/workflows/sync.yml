name: Sync data from issue
on:
  issues:
    types: [opened]

permissions:
  contents: write
  issues: write

# 同一时间只处理一个写回，避免并发覆盖
concurrency:
  group: cf-sync-write
  cancel-in-progress: false

jobs:
  sync:
    # 只处理本应用提交的同步 issue（标题固定为 sync）
    if: github.event.issue.title == 'sync'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Extract payload and write data file
        id: extract
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const body = context.payload.issue.body || '';
            const m = body.match(/```json\s*([\s\S]*?)```/);
            if (!m) {
              core.setFailed('issue 中没有找到 json 数据块');
              return;
            }
            let payload;
            try {
              payload = JSON.parse(m[1]);
            } catch (e) {
              core.setFailed('数据不是合法 JSON：' + e.message);
              return;
            }
            if (!payload.iv || !payload.ct) {
              core.setFailed('缺少 iv/ct 字段，不是有效的加密载荷');
              return;
            }
            fs.mkdirSync('data', { recursive: true });
            fs.writeFileSync('data/encrypted.json', JSON.stringify(payload));
            core.setOutput('valid', 'true');

      - name: Commit and push
        if: steps.extract.outputs.valid == 'true'
        run: |
          git config user.name "cf-sync-bot"
          git config user.email "actions@github.com"
          git add data/encrypted.json
          if git diff --cached --quiet; then
            echo "no changes, skip commit"
          else
            git commit -m "同步数据 #${{ github.event.issue.number }}"
            git push origin main
          fi

      # 无论成功与否都关闭同步 issue（保留编号供追溯，避免 issue 列表堆积）
      - name: Close issue
        if: always()
        run: |
          curl -s -X PATCH \
            -H "Authorization: Bearer ${{ secrets.GITHUB_TOKEN }}" \
            -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/${{ github.repository }}/issues/${{ github.event.issue.number }}" \
            -d '{"state":"closed"}'
